<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Comentários </title>
    <link rel="stylesheet" href="styles/comentario.css">
</head>
<body>

    <main class="container">
        <h1>Deixe seu Comentário</h1>
        
        <div class="input-group">
            <textarea id="campoTexto" placeholder="O que você está pensando?" maxlength="120"></textarea>
            
            <div class="feedback-row">
                <span id="contador">0 / 100</span>
                <p id="message-alert"></p>
            </div>

            <button id="btnPublicar">Publicar Comentário</button>
        </div>

        <hr>

        <section id="comentarios">
            </section>
    </main>


    <script src="scripts/contador.js"></script>
</body>
</html>
